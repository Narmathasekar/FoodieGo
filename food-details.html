<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food Details | FoodieGo</title>
        <base href="/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/FoodieGo/css/style.css">
</head>

<body data-page="detail">
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container py-2"><a class="navbar-brand brand" href="index.html">Foodie<span>Go</span></a><button
                class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span
                    class="navbar-toggler-icon"></span></button>
            <div id="nav" class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li><a class="nav-link" href="index.html">Home</a></li>
                    <li><a class="nav-link" href="menu.html">Menu</a></li>
                    <li><a class="nav-link" href="recipe.html">Recipes</a></li>
                    <li><a class="nav-link" href="tracking.html">Track Order</a></li>
                </ul><a href="cart.html" class="position-relative"><i class="bi bi-bag fs-5"></i><span
                        class="cart-count position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">0</span></a>
            </div>
        </div>
    </nav>
    <main class="section-pad">
        <div class="container"><a href="menu.html" class="meta"><i class="bi bi-arrow-left"></i> Back to menu</a>
            <div class="row align-items-center g-5 mt-2">
                <div class="col-lg-6"><img class="detail-image" data-food-img src="" alt="Food item"></div>
                <div class="col-lg-6 detail-panel"><span class="badge-soft">🔥 Popular today</span>
                    <h1 class="display-4 mt-3" data-food-name>Masala Dosa</h1>
                    <div class="d-flex gap-4 my-3"><span class="rating" data-food-rating>★ 4.8</span><span
                            class="meta"><i class="bi bi-clock"></i> 15 min</span><span class="meta"><i
                                class="bi bi-fire"></i> Hot</span></div>
                    <p class="hero-copy" data-food-desc></p>
                    <div class="d-flex align-items-center gap-3 my-4"><span class="price display-6"
                            data-food-price>₹80</span><span class="meta">inclusive of all taxes</span></div>
                    <h2 class="h5">What's inside</h2>
                    <div class="d-flex flex-wrap gap-2 my-3"><span class="ingredient">Rice & lentils</span><span
                            class="ingredient">Potato masala</span><span class="ingredient">Coconut chutney</span><span
                            class="ingredient">Sambar</span></div>
                    <div class="d-flex flex-wrap gap-3 mt-4"><a data-customize class="btn btn-outline-brand"
                            href="customize.html">Customize Order</a><button data-add-detail class="btn btn-brand">Add
                            to Cart <i class="bi bi-bag-plus ms-1"></i></button></div>
                </div>
            </div>
        </div>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast">
            <div class="toast-body"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script src="/FoodieGo/js/script.js"></script>
</body>

</html>
