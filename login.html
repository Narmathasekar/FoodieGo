<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | FoodieGo</title>
        <base href="/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="auth">
    <nav class="navbar">
        <div class="container py-2"><a class="brand" href="index.html">Foodie<span>Go</span></a><a href="index.html"
                class="meta">Back home</a></div>
    </nav>
    <main class="auth-wrap">
        <div class="auth-card col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="eyebrow">Welcome back</div>
            <h1 class="display-6 mt-2">Good to see you.</h1>
            <p class="meta">Sign in to keep your cravings moving.</p>
            <form data-auth="login" novalidate><label class="form-label mt-3" for="email">Email</label><input id="email"
                    class="form-control" type="email" required placeholder="you@example.com">
                <div class="invalid-feedback">Enter a valid email.</div><label class="form-label mt-3"
                    for="password">Password</label><input id="password" class="form-control" type="password" required
                    minlength="6" placeholder="At least 6 characters">
                <div class="invalid-feedback">Enter your password.</div>
                <div class="d-flex justify-content-between align-items-center mt-3"><label><input type="checkbox">
                        Remember me</label><a class="small" href="#">Forgot password?</a></div><button
                    class="btn btn-brand w-100 mt-4">Login</button>
                <div id="form-message" class="mt-3"></div>
            </form>
            <p class="text-center meta mt-4">New here? <a href="register.html"
                    style="color:var(--orange);font-weight:800">Create an account</a></p>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
