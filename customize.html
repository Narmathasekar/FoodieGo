<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customize | FoodieGo</title>
        <base href="/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/FoodieGo/css/style.css">
</head>

<body data-page="customize">
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container py-2"><a class="navbar-brand brand" href="index.html">Foodie<span>Go</span></a>
            <div class="ms-auto"><a href="cart.html" class="position-relative"><i class="bi bi-bag fs-5"></i><span
                        class="cart-count position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">0</span></a>
            </div>
        </div>
    </nav>
    <main class="section-pad">
        <div class="container">
            <div class="eyebrow">Make it yours</div>
            <h1 class="display-4 mb-4">Build your perfect <span style="color:var(--orange)">bite.</span></h1>
            <div class="row g-4">
                <div class="col-lg-6"><img class="detail-image sticky-lg-top" style="top:100px" data-food-img src=""
                        alt="Customizable food item"></div>
                <div class="col-lg-6">
                    <div class="customizer">
                        <h2 class="h4" data-food-name>Masala Dosa</h2>
                        <hr>
                        <h3 class="h6 mt-4">Choose Size</h3><label class="choice"><span>Regular</span><input
                                class="size" type="radio" name="size" value="Regular" checked></label><label
                            class="choice"><span>Large</span><input class="size" type="radio" name="size"
                                value="Large"></label><label class="choice"><span>Extra Large</span><input class="size"
                                type="radio" name="size" value="Extra Large"></label>
                        <h3 class="h6 mt-4">Spice Level</h3><label class="choice"><span>Mild</span><input class="spice"
                                type="radio" name="spice" value="Mild" checked></label><label
                            class="choice"><span>Medium</span><input class="spice" type="radio" name="spice"
                                value="Medium"></label><label class="choice"><span>Spicy</span><input class="spice"
                                type="radio" name="spice" value="Spicy"></label>
                        <h3 class="h6 mt-4">Add Extras</h3><label class="choice"><span>Extra Cheese <small
                                    class="text-muted">+₹30</small></span><input class="extra" type="checkbox"
                                value="Extra Cheese" data-price="30"></label><label class="choice"><span>Extra Sauce
                                <small class="text-muted">+₹15</small></span><input class="extra" type="checkbox"
                                value="Extra Sauce" data-price="15"></label><label class="choice"><span>Extra Vegetables
                                <small class="text-muted">+₹25</small></span><input class="extra" type="checkbox"
                                value="Extra Vegetables" data-price="25"></label>
                        <h3 class="h6 mt-4">Quantity</h3>
                        <div class="qty-control"><button id="minus">−</button><input id="quantity" value="1" readonly
                                style="width:38px;border:0;text-align:center"><button id="plus">+</button></div>
                        <div class="summary-box mt-4">
                            <div class="d-flex justify-content-between"><span>Base price</span><strong
                                    data-base>₹80</strong></div>
                            <div class="d-flex justify-content-between"><span>Add-ons</span><strong
                                    data-extras>₹0</strong></div>
                            <div class="d-flex justify-content-between"><span>Quantity</span><strong data-qty>1</strong>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between h4"><span>Total</span><strong class="price"
                                    data-total>₹80</strong></div><button id="custom-add"
                                class="btn btn-brand w-100 mt-2">Add Customized Item</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast">
            <div class="toast-body"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/FoodieGo/js/script.js"></script>
</body>

</html>
