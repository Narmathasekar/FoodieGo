<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | FoodieGo</title>
        <base href="/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/FoodieGo/css/style.css">
</head>

<body data-page="auth">
    <nav class="navbar">
        <div class="container py-2"><a class="brand" href="index.html">Foodie<span>Go</span></a><a href="login.html"
                class="meta">Already a member?</a></div>
    </nav>
    <main class="auth-wrap">
        <div class="auth-card col-11 col-sm-8 col-md-6 col-lg-5">
            <div class="eyebrow">Join the table</div>
            <h1 class="display-6 mt-2">Make room for good food.</h1>
            <form data-auth="register" novalidate><label class="form-label mt-3" for="full-name">Full Name</label><input
                    id="full-name" class="form-control" required placeholder="Your name"><label class="form-label mt-3"
                    for="email">Email</label><input id="email" class="form-control" type="email" required
                    placeholder="you@example.com"><label class="form-label mt-3" for="phone">Phone</label><input
                    id="phone" class="form-control" type="tel" pattern="[0-9]{10}" required
                    placeholder="10 digit number">
                <div class="invalid-feedback">Enter a valid 10 digit phone number.</div>
                <div class="row">
                    <div class="col-md-6"><label class="form-label mt-3" for="password">Password</label><input
                            id="password" class="form-control" type="password" minlength="6" required></div>
                    <div class="col-md-6"><label class="form-label mt-3" for="confirm-password">Confirm
                            Password</label><input id="confirm-password" class="form-control" type="password" required>
                    </div>
                </div><button class="btn btn-brand w-100 mt-4">Create Account</button>
                <div id="form-message" class="mt-3"></div>
            </form>
            <p class="text-center meta mt-4">Already have an account? <a href="login.html"
                    style="color:var(--orange);font-weight:800">Log in</a></p>
        </div>
    </main>
    <script src="/FoodieGo/js/script.js"></script>
</body>

</html>
