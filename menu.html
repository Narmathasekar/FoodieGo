<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu | FoodieGo</title>
        <base href="/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="menu">
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container py-2"><a class="navbar-brand brand" href="index.html">Foodie<span>Go</span></a><button
                class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span
                    class="navbar-toggler-icon"></span></button>
            <div id="nav" class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li><a class="nav-link" href="index.html">Home</a></li>
                    <li><a class="nav-link active" href="menu.html">Menu</a></li>
                    <li><a class="nav-link" href="recipe.html">Recipes</a></li>
                    <li><a class="nav-link" href="tracking.html">Track Order</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3"><a href="cart.html" class="position-relative"><i
                            class="bi bi-bag fs-5"></i><span
                            class="cart-count position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">0</span></a><a
                        class="btn btn-brand btn-sm" href="login.html">Login</a></div>
            </div>
        </div>
    </nav>
    <header class="page-head">
        <div class="container">
            <div class="eyebrow">The delicious shortlist</div>
            <h1 class="display-3">Find Your Next Favourite</h1>
            <p class="hero-copy">Comfort classics, fresh ideas, and everything in between.</p>
            <div class="search-box d-flex align-items-center gap-2 mt-4 col-lg-7"><i class="bi bi-search"></i><input
                    id="food-search" placeholder="Search for pizza, dosa, biryani..."></div>
        </div>
    </header>
    <main class="section-pad">
        <div class="container">
            <div class="d-flex flex-wrap gap-2 mb-4"><button class="filter-btn active"
                    data-cat="All">All</button><button class="filter-btn" data-cat="Breakfast">Breakfast</button><button
                    class="filter-btn" data-cat="Pizza">Pizza</button><button class="filter-btn"
                    data-cat="Burgers">Burgers</button><button class="filter-btn" data-cat="South Indian">South
                    Indian</button><button class="filter-btn" data-cat="Chinese">Chinese</button><button
                    class="filter-btn" data-cat="Desserts">Desserts</button><button class="filter-btn"
                    data-cat="Healthy">Healthy</button><button class="filter-btn"
                    data-cat="Beverages">Beverages</button></div>
            <div id="food-grid" class="row g-4"></div>
        </div>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast">
            <div class="toast-body"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
